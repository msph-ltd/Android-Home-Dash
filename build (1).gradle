plugins { id 'com.android.application' }
android {
    namespace 'uk.msph.hmhome'
    compileSdk 35
    defaultConfig { applicationId 'uk.msph.hmhome'; minSdk 29; targetSdk 35; versionCode 1; versionName '0.1.0' }
    signingConfigs { debug { storeFile rootProject.file('personal-test.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
